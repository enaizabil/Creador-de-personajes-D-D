[project]
name = "creador-personajes-dnd"
version = "0.1.0"
description = "Creador de personajes de rol portable y ampliable mediante paquetes de contenido."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
creador = "creador.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
